name: test

on:
  pull_request:
  push:
    branches: [master]
  release:
    types: [created]

jobs:
  test:
    runs-on: ${{matrix.machine}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - odoo-version: 13.0
            python-version: 3.8
            machine: ubuntu-22.04
          - odoo-version: 14.0
            python-version: 3.8
            machine: ubuntu-22.04
          - odoo-version: 15.0
            python-version: 3.8
            machine: ubuntu-22.04
          - odoo-version: 16.0
            python-version: "3.10"
            machine: ubuntu-22.04
          - odoo-version: 17.0
            python-version: "3.10"
            machine: ubuntu-22.04
          - odoo-version: 18.0
            python-version: "3.12"
            machine: ubuntu-24.04
          - odoo-version: 19.0
            python-version: "3.12"
            machine: ubuntu-24.04
          - odoo-version: 20.0
            python-version: "3.12"
            machine: ubuntu-26.04
    steps:
      # Prepare environment
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This project requires python >= 3.11. The rendered template CI uses other
      # python versions per Odoo version, so we still need those available for the
      # pre-commit hooks installation test.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"

      - name: Install python for rendered pre-commit hooks
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Let tests issue git commits
      - run: git config --global user.name CI
      - run: git config --global user.email CI@GITHUB

      # Run all tests
      - run: uv run pytest --color yes -v
        env:
          SELECTED_ODOO_VERSIONS: ${{ matrix.odoo-version }}
