[project]
name = "oca-addons-repo-template"
version = "1.0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "copier>=9",
    "pytest",
    "pre-commit",
    "pytest-xdist",
    # Pre-commit installs per-hook virtualenvs for the rendered template, which
    # still supports Odoo versions running on Python 3.8/3.10. Recent virtualenv
    # no longer bundles pip/setuptools wheels for EOL Pythons, so pin an older
    # release that can still seed those environments. Used only in this repo's
    # test suite.
    "virtualenv<20.27",
]

# ruff

[tool.ruff]
fix = true

[tool.ruff.lint]
extend-select = [
    "UP",  # pyupgrade
    "I",  # isort
]

# pytest

[tool.pytest.ini_options]
addopts = "-n auto -ra tests"
